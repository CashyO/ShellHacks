<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ProjectGraph</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
*{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --sunk:#F6F8FA; --ink:#16202A; --muted:#5A6774; --line:#D6DDE3; --edge:#B9C3CC;
  --accent:#1F5FD6; --accent-ink:#FFFFFF;
  --feature:#2E6BE6; --improvement:#7B4ED8; --fix:#C27C06; --security:#D23C35; --test:#0C8585; --done:#1C9A50;
  --add-bg:#E4F5EA; --add-ink:#145C31; --del-bg:#FBE7E6; --del-ink:#8E1F1A;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0D1217; --surface:#151C23; --sunk:#10161C; --ink:#E4EAF0; --muted:#8F9DAA; --line:#27313B; --edge:#3A4652;
    --accent:#5B93F5; --accent-ink:#0B1016;
    --feature:#5B93F5; --improvement:#A580F2; --fix:#E4A93F; --security:#F06A62; --test:#35BDB7; --done:#3DC677;
    --add-bg:#12301F; --add-ink:#8EE0AE; --del-bg:#361615; --del-ink:#F4A6A1;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0D1217; --surface:#151C23; --sunk:#10161C; --ink:#E4EAF0; --muted:#8F9DAA; --line:#27313B; --edge:#3A4652;
  --accent:#5B93F5; --accent-ink:#0B1016;
  --feature:#5B93F5; --improvement:#A580F2; --fix:#E4A93F; --security:#F06A62; --test:#35BDB7; --done:#3DC677;
  --add-bg:#12301F; --add-ink:#8EE0AE; --del-bg:#361615; --del-ink:#F4A6A1;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5}
button{font:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:auto 1fr;gap:12px;padding-inline:16px;padding-block:12px 16px;box-sizing:border-box}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:-.01em;margin:0}
.proto{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.repo{font-family:var(--mono);font-size:12px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px 8px;color:var(--ink)}
.watch{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.dot{width:8px;height:8px;border-radius:50%;background:var(--done);box-shadow:0 0 0 3px color-mix(in srgb,var(--done) 22%,transparent)}
.watch.busy .dot{background:var(--fix);box-shadow:0 0 0 3px color-mix(in srgb,var(--fix) 25%,transparent);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.35}}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:7px;padding:7px 12px;font-weight:500;font-size:13px}
.btn:hover:not(:disabled){border-color:var(--edge)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* main */
.main{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:12px;min-height:0}
.stage{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-height:0;
  background-image:radial-gradient(circle,color-mix(in srgb,var(--edge) 55%,transparent) 1px,transparent 1.2px);background-size:22px 22px}
#graph{width:100%;height:100%;display:block;touch-action:none}
.legend{position:absolute;left:12px;bottom:12px;display:flex;flex-wrap:wrap;gap:6px 12px;max-width:calc(100% - 24px);
  background:color-mix(in srgb,var(--surface) 88%,transparent);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:11.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{width:10px;height:10px;border-radius:50%;border:2px solid var(--c);background:color-mix(in srgb,var(--c) 20%,var(--surface))}
.sw.solid{background:var(--c)}
.hint{position:absolute;top:12px;left:12px;font-size:12px;color:var(--muted);background:color-mix(in srgb,var(--surface) 88%,transparent);border:1px solid var(--line);border-radius:8px;padding:5px 9px}

/* graph */
.link{stroke:var(--edge);stroke-width:1.4}
.link.shipped{stroke:var(--done);stroke-opacity:.6;stroke-width:2}
.node{cursor:pointer}
.node[data-type=feature]{--c:var(--feature)} .node[data-type=improvement]{--c:var(--improvement)}
.node[data-type=fix]{--c:var(--fix)} .node[data-type=security]{--c:var(--security)} .node[data-type=test]{--c:var(--test)}
.node .body{fill:color-mix(in srgb,var(--c) 16%,var(--surface));stroke:var(--c);stroke-width:2;stroke-dasharray:3 2.5;transition:fill .5s,stroke .5s}
.node.pr .body{stroke-dasharray:none;fill:color-mix(in srgb,var(--c) 45%,var(--surface))}
.node.done .body{fill:var(--done);stroke:var(--done);stroke-dasharray:none}
.node .check{fill:#fff;font-size:12px;font-weight:700;text-anchor:middle;dominant-baseline:central;opacity:0;pointer-events:none}
.node.done .check{opacity:1}
.node .ring{fill:none;stroke:var(--c);stroke-width:2;opacity:0;transform-box:fill-box;transform-origin:center}
.node.pr .ring{opacity:1;animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.7);opacity:0}}
.node .halo{fill:none;stroke:var(--ink);stroke-width:1.5;stroke-dasharray:2 3;opacity:0}
.node.sel .halo{opacity:.8}
.node.root .halo{display:none}
.node text.lbl{font-size:11.5px;fill:var(--ink);text-anchor:middle;paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round;pointer-events:none;font-weight:500}
.node.suggested text.lbl{fill:var(--muted)}
.node.root .body{fill:var(--ink);stroke:var(--ink);stroke-dasharray:none}
.node.root text.lbl{font-family:var(--mono);font-size:12px;font-weight:500;fill:var(--ink)}
.node.root .rootring{fill:none;stroke:var(--line);stroke-width:5}
.node.root .rootarc{fill:none;stroke:var(--done);stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset .8s}
.node.root .inner{fill:var(--surface);font-family:var(--display);font-weight:700;font-size:15px;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .55s cubic-bezier(.3,1.5,.5,1) both}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}

/* panel */
.panel{display:flex;flex-direction:column;gap:12px;min-height:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
#detail{overflow:auto;flex:0 1 auto;max-height:64%}
.feedcard{flex:1 1 auto;min-height:140px;display:flex;flex-direction:column;overflow:hidden}
.eyebrow{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 6px}
#detail h2{font-family:var(--display);font-weight:700;font-size:21px;line-height:1.2;letter-spacing:-.01em;margin:0 0 8px;text-wrap:balance}
#detail p{margin:0 0 12px;max-width:62ch}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{font-size:11.5px;font-weight:500;border-radius:999px;padding:2px 9px;border:1px solid var(--line);color:var(--muted);background:var(--sunk)}
.chip.type{--c:var(--feature);color:var(--c);border-color:color-mix(in srgb,var(--c) 45%,transparent);background:color-mix(in srgb,var(--c) 10%,var(--surface))}
.chip.type.improvement{--c:var(--improvement)} .chip.type.fix{--c:var(--fix)} .chip.type.security{--c:var(--security)} .chip.type.test{--c:var(--test)}
.chip.st-pr{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.chip.st-done{color:var(--done);border-color:color-mix(in srgb,var(--done) 45%,transparent)}
.why{border-left:3px solid var(--line);padding-left:10px;color:var(--ink)}
.files{list-style:none;padding:0;margin:0 0 14px;display:flex;flex-direction:column;gap:3px}
.files li{font-family:var(--mono);font-size:12px;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
details{margin-top:4px}
summary{cursor:pointer;color:var(--muted);font-size:12.5px}
pre.prompt{white-space:pre-wrap;font-family:var(--mono);font-size:11.5px;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:10px;margin:8px 0 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stat{background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.stat b{display:block;font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--muted)}
.diff{border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:10px 0 12px}
.diff .fname{font-family:var(--mono);font-size:11.5px;padding:6px 10px;background:var(--sunk);border-bottom:1px solid var(--line);color:var(--muted)}
.diff .code{overflow-x:auto}
.diff pre{margin:0;font-family:var(--mono);font-size:11.5px;line-height:1.55}
.diff pre span{display:block;padding:0 10px;white-space:pre;min-width:max-content}
.diff .add{background:var(--add-bg);color:var(--add-ink)}
.diff .del{background:var(--del-bg);color:var(--del-ink)}
.diff .hunk{color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,var(--surface))}
.steps{list-style:none;padding:0;margin:8px 0 12px;display:flex;flex-direction:column;gap:6px}
.steps li{display:flex;gap:8px;align-items:center;font-size:13px}
.steps li::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--line);flex:none}
.steps li.ok::before{background:var(--done)}
.steps li code{font-family:var(--mono);font-size:12px}
.feedhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
#feed{list-style:none;margin:0;padding:0;overflow:auto;display:flex;flex-direction:column;gap:9px}
#feed li{display:grid;grid-template-columns:44px 1fr;gap:8px;font-size:12.5px;line-height:1.45;animation:fadein .35s both}
#feed time{font-family:var(--mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:1px}
#feed code{font-family:var(--mono);font-size:11.5px;background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:0 4px}
#feed .k-sync{color:var(--muted)}
#feed .k-ship b{color:var(--done)}
#feed .k-pr b{color:var(--accent)}
@keyframes fadein{from{opacity:0;transform:translateY(-3px)}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}

@media (max-width:860px){
  html,body{height:auto}
  .app{height:auto}
  .main{grid-template-columns:1fr}
  .stage{height:62vh;min-height:380px}
  #detail{max-height:none}
  .feedcard{max-height:360px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>

</head><body>
<div class="app">
  <header class="top">
    <div class="brand"><h1>ProjectGraph</h1><span class="proto">Prototype · simulated data</span></div>
    <span class="repo">infinity/chronos-scheduler · main</span>
    <div class="watch" id="watch"><span class="dot"></span><span id="watchText">Watching main</span></div>
    <div class="spacer"></div>
    <button class="btn" id="restartBtn" type="button">Restart demo</button>
    <button class="btn primary" id="pushBtn" type="button">Simulate a push</button>
  </header>

  <div class="main">
    <div class="stage" id="stage">
      <svg id="graph" role="img" aria-label="Idea map for chronos-scheduler"></svg>
      <div class="hint">Click a bubble · drag to rearrange · scroll to zoom</div>
      <div class="legend" aria-label="Legend">
        <span><i class="sw" style="--c:var(--feature)"></i>Feature</span>
        <span><i class="sw" style="--c:var(--improvement)"></i>Improvement</span>
        <span><i class="sw" style="--c:var(--fix)"></i>Fix</span>
        <span><i class="sw" style="--c:var(--security)"></i>Security</span>
        <span><i class="sw" style="--c:var(--test)"></i>Test</span>
        <span><i class="sw solid" style="--c:var(--done)"></i>Shipped</span>
      </div>
    </div>

    <aside class="panel">
      <section class="card" id="detail" aria-live="polite"></section>
      <section class="card feedcard">
        <div class="feedhead"><p class="eyebrow">Activity</p></div>
        <ol id="feed"></ol>
      </section>
    </aside>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
/* ---------- Simulated Gemini output for a small React + Express scheduling app ---------- */
const TYPE_LABEL = {feature:"Feature", improvement:"Improvement", fix:"Fix", security:"Security", test:"Test"};
const EFFORT_LABEL = {S:"Small", M:"Medium", L:"Large"};
const RADIUS = {S:13, M:17, L:22};

const IDEAS = {
  timer:{title:"Pomodoro timer", type:"feature", effort:"S",
    desc:"Show a countdown on each time block in the day view so a user can start a focus session from the block itself.",
    why:"blockDuration() in schedule.js already computes each block's length, so the timer only needs a tick loop and a small component.",
    files:["src/schedule.js","src/components/Timer.jsx"], kids:["pause","notify","focus"],
    diff:[{file:"src/schedule.js", lines:[
      "@@ -41,6 +41,14 @@ export function blockDuration(block) {",
      "   return (block.end - block.start) / 60000;"," }","+",
      "+export function createTimer(minutes, onTick, onDone) {","+  let left = minutes * 60;",
      "+  const id = setInterval(() => {","+    left -= 1; onTick(left);",
      "+    if (left <= 0) { clearInterval(id); onDone(); }","+  }, 1000);",
      "+  return () => clearInterval(id);","+}"]},
      {file:"src/components/Timer.jsx  (new file)", lines:[
      "@@ -0,0 +1,10 @@","+import { useEffect, useState } from 'react';",
      "+import { createTimer, blockDuration } from '../schedule';","+",
      "+export default function Timer({ block }) {",
      "+  const [left, setLeft] = useState(blockDuration(block) * 60);",
      "+  useEffect(() => createTimer(blockDuration(block), setLeft, () => {}), [block]);",
      "+  const m = Math.floor(left / 60), s = String(left % 60).padStart(2, '0');",
      "+  return <span className=\"timer\">{m}:{s}</span>;","+}"]}]},
  recur:{title:"Recurring events", type:"feature", effort:"M",
    desc:"Let an event repeat daily, weekly, or on chosen weekdays.",
    why:"events.js stores single start/end pairs; adding a repeat rule and expanding it in the store keeps the API shape intact.",
    files:["src/api/events.js","src/store.js"], kids:["rrule","editall"]},
  drag:{title:"Drag to reschedule", type:"feature", effort:"M",
    desc:"Drag a block to a new time slot in the calendar and save the change.",
    why:"calendar.jsx renders blocks with absolute positions already, so pointer events can map y-offset back to a time.",
    files:["src/calendar.jsx","src/store.js"], kids:["snap","undo"]},
  conflict:{title:"Conflict detection", type:"improvement", effort:"S",
    desc:"Warn when a new event overlaps an existing one.",
    why:"addEvent() in schedule.js never checks existing blocks for overlap.",
    files:["src/schedule.js"], kids:["freeslot"]},
  ical:{title:"iCal export", type:"feature", effort:"M",
    desc:"Download the schedule as an .ics file that other calendar apps can import.",
    why:"Events already carry title, start and end, which map directly onto VEVENT fields.",
    files:["server/index.js","src/api/events.js"], kids:["gcal"]},
  valid:{title:"Validate POST /events", type:"security", effort:"S",
    desc:"Reject malformed or oversized event payloads before they reach the database.",
    why:"server/index.js passes req.body straight into db.insert, so any field a client sends gets stored.",
    files:["server/index.js"], kids:["ratelimit","apitests"],
    diff:[{file:"server/index.js", lines:[
      "@@ -18,7 +18,13 @@ app.post('/events', async (req, res) => {",
      "-  const event = await db.insert('events', req.body);",
      "+  const { title, start, end } = req.body ?? {};",
      "+  if (typeof title !== 'string' || title.length > 200)",
      "+    return res.status(400).json({ error: 'title must be a string under 200 chars' });",
      "+  if (!Date.parse(start) || !Date.parse(end) || Date.parse(end) <= Date.parse(start))",
      "+    return res.status(400).json({ error: 'start and end must be ISO dates, end after start' });",
      "+  const event = await db.insert('events', { title, start, end });",
      "   res.status(201).json(event);"]}]},
  tz:{title:"Timezone bug", type:"fix", effort:"S",
    desc:"Events shift by hours for users outside the server's timezone.",
    why:"parseEvent() calls new Date(raw.start) on strings without a Z suffix, which browsers read as local time.",
    files:["src/schedule.js"], kids:["tzsetting"],
    diff:[{file:"src/schedule.js", lines:[
      "@@ -12,7 +12,7 @@ export function parseEvent(raw) {","   return {","     ...raw,",
      "-    start: new Date(raw.start),","-    end: new Date(raw.end),",
      "+    start: new Date(raw.start.endsWith('Z') ? raw.start : raw.start + 'Z'),",
      "+    end: new Date(raw.end.endsWith('Z') ? raw.end : raw.end + 'Z'),","   };"]}]},
  tests:{title:"Tests for schedule.js", type:"test", effort:"S",
    desc:"Unit tests for blockDuration, parseEvent and addEvent.",
    why:"schedule.js holds all the date math and has no tests; it's the file most likely to break silently.",
    files:["src/schedule.test.js"], kids:["ci"]},
  keys:{title:"Keyboard shortcuts", type:"improvement", effort:"S",
    desc:"N for new event, arrow keys to move between days, T to jump to today.",
    why:"calendar.jsx already has goToDay() and openNewEvent() handlers to bind keys to.",
    files:["src/calendar.jsx"], kids:["cheatsheet"]},

  pause:{title:"Pause and resume", type:"feature", effort:"S", desc:"Pause a running timer and pick up where it left off.", why:"createTimer() returns only a stop function; returning pause/resume keeps the component simple.", files:["src/schedule.js","src/components/Timer.jsx"]},
  notify:{title:"Notify when time is up", type:"feature", effort:"S", desc:"Browser notification when a focus block ends.", why:"Timer's onDone callback is currently empty.", files:["src/components/Timer.jsx"]},
  focus:{title:"Focus-time stats", type:"feature", effort:"M", desc:"Weekly total of completed focus sessions.", why:"Completed timers can be recorded in store.js next to events.", files:["src/store.js","src/components/Stats.jsx"]},
  rrule:{title:"RRULE support", type:"improvement", effort:"M", desc:"Store repeats in the standard RRULE format.", why:"Makes recurring events line up with iCal export later.", files:["src/api/events.js"]},
  editall:{title:"Edit one or all repeats", type:"feature", effort:"M", desc:"Ask whether a change applies to one occurrence or the series.", why:"Needed once recurring events exist.", files:["src/calendar.jsx"]},
  snap:{title:"Snap to 15 minutes", type:"improvement", effort:"S", desc:"Round dragged blocks to the nearest quarter hour.", why:"Free dragging produces times like 9:07.", files:["src/calendar.jsx"]},
  undo:{title:"Undo a move", type:"feature", effort:"S", desc:"Undo the last reschedule with Ctrl+Z.", why:"store.js updates are single writes, easy to keep a history of.", files:["src/store.js"]},
  freeslot:{title:"Suggest a free slot", type:"feature", effort:"M", desc:"On conflict, offer the nearest open time.", why:"Overlap check already walks the day's blocks.", files:["src/schedule.js"]},
  gcal:{title:"Google Calendar sync", type:"feature", effort:"L", desc:"Two-way sync with a Google account.", why:"Builds on the .ics mapping.", files:["server/google.js"]},
  ratelimit:{title:"Rate-limit event writes", type:"security", effort:"S", desc:"Cap POST /events per client per minute.", why:"The endpoint has no auth or throttling.", files:["server/index.js"]},
  apitests:{title:"API schema tests", type:"test", effort:"S", desc:"Tests that bad payloads get a 400.", why:"Locks in the new validation.", files:["server/events.test.js"]},
  tzsetting:{title:"User timezone setting", type:"feature", effort:"S", desc:"Let users pick their display timezone.", why:"Dates are UTC internally after the fix.", files:["src/settings.jsx"]},
  ci:{title:"Run tests on push", type:"improvement", effort:"S", desc:"GitHub Actions workflow that runs the test suite.", why:"Tests exist but nothing runs them.", files:[".github/workflows/test.yml"]},
  cheatsheet:{title:"Shortcut cheat sheet", type:"improvement", effort:"S", desc:"Press ? to see all shortcuts.", why:"Shortcuts are invisible otherwise.", files:["src/components/Help.jsx"]},

  week:{title:"Week view", type:"feature", effort:"M", desc:"You built a seven-column week layout.", why:"Detected in commit e1f08b2: new WeekView.jsx rendering seven DayColumn components.", files:["src/components/WeekView.jsx"], kids:["weekstats","dragdays"]},
  weekstats:{title:"Week summary bar", type:"feature", effort:"S", desc:"Hours booked per day across the top of the week view.", why:"WeekView already has each day's blocks in hand.", files:["src/components/WeekView.jsx"]},
  dragdays:{title:"Drag across days", type:"improvement", effort:"M", desc:"Move a block from Monday to Tuesday in week view.", why:"DayColumn components don't share a drop target yet.", files:["src/components/WeekView.jsx","src/calendar.jsx"]},
};
const FIRST_RING = ["timer","recur","drag","conflict","ical","valid","tz","tests","keys"];

const SCRIPTED_PUSHES = [
  {sha:"b7d2f10", msg:"add Timer to day view", author:"josiah", marks:"timer", plus:42, minus:3},
  {sha:"c93e4a1", msg:"parse event dates as UTC", author:"maya", marks:"tz", plus:4, minus:2},
  {sha:"e1f08b2", msg:"week view layout", author:"josiah", adds:"week", plus:118, minus:6},
];

/* ---------- state ---------- */
let nodes, links, selectedId, panelMode, busy, prCounter, pushIndex, generation = 0;
const byId = id => nodes.find(n => n.id === id);
const wait = ms => new Promise(r => setTimeout(r, ms));

/* ---------- graph ---------- */
const svg = d3.select("#graph");
const zoomLayer = svg.append("g");
const linkG = zoomLayer.append("g");
const nodeG = zoomLayer.append("g");
const zoom = d3.zoom().scaleExtent([0.35, 2.5]).on("zoom", e => zoomLayer.attr("transform", e.transform));
svg.call(zoom).on("dblclick.zoom", null);
svg.on("click", e => { if (e.target === svg.node()) select("root"); });

const sim = d3.forceSimulation()
  .force("link", d3.forceLink().id(d => d.id).distance(l => l.target.depth === 1 ? 160 : 85).strength(.8))
  .force("charge", d3.forceManyBody().strength(d => d.id === "root" ? -1100 : -300))
  .force("collide", d3.forceCollide(d => r(d) + 32))
  .force("x", d3.forceX(0).strength(.03)).force("y", d3.forceY(0).strength(.03))
  .on("tick", ticked);

function r(d){ return d.id === "root" ? 36 : RADIUS[d.effort] }

function sizeStage(){
  const el = document.getElementById("stage");
  const w = el.clientWidth, h = el.clientHeight;
  svg.attr("viewBox", [-w/2, -h/2, w, h]);
  return w;
}
new ResizeObserver(sizeStage).observe(document.getElementById("stage"));

const drag = d3.drag()
  .on("start", (e,d) => { if (!e.active) sim.alphaTarget(.2).restart(); d.fx = d.x; d.fy = d.y; })
  .on("drag", (e,d) => { d.fx = e.x; d.fy = e.y; })
  .on("end", (e,d) => { if (!e.active) sim.alphaTarget(0); if (d.id !== "root") { d.fx = null; d.fy = null; } });

function render(){
  const lk = linkG.selectAll("line").data(links, d => (d.source.id||d.source) + ">" + (d.target.id||d.target));
  lk.enter().append("line").attr("class","link");
  lk.exit().remove();

  const nd = nodeG.selectAll("g.node").data(nodes, d => d.id);
  const enter = nd.enter().append("g").attr("class","node").attr("data-type", d => d.type || "root")
    .attr("tabindex", 0).attr("role","button").attr("aria-label", d => d.title)
    .on("click", (e,d) => { e.stopPropagation(); select(d.id); })
    .on("keydown", (e,d) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(d.id); } })
    .call(drag);
  const pop = enter.append("g").attr("class","pop");
  pop.append("circle").attr("class","halo").attr("r", d => r(d) + 7);
  pop.append("circle").attr("class","ring").attr("r", d => r(d) + 2);
  pop.append("circle").attr("class","body").attr("r", d => r(d));
  pop.filter(d => d.id !== "root").append("text").attr("class","check").text("✓");
  const root = pop.filter(d => d.id === "root");
  root.append("circle").attr("class","rootring").attr("r", 44);
  root.append("circle").attr("class","rootarc").attr("r", 44).attr("transform","rotate(-90)")
      .attr("stroke-dasharray", 2*Math.PI*44).attr("stroke-dashoffset", 2*Math.PI*44);
  root.append("text").attr("class","inner").attr("id","rootPct");
  pop.append("text").attr("class","lbl").attr("y", d => d.id === "root" ? 64 : r(d) + 15).text(d => d.title);
  nd.exit().remove();

  nodeG.selectAll("g.node")
    .attr("class", d => ["node", d.id === "root" ? "root" : d.status, d.id === selectedId ? "sel" : ""].join(" "));
  linkG.selectAll("line").attr("class", d => "link" + (byId(d.target.id||d.target)?.status === "done" ? " shipped" : ""));

  // root progress ring
  const ideas = nodes.filter(n => n.id !== "root");
  const shipped = ideas.filter(n => n.status === "done").length;
  const frac = ideas.length ? shipped / ideas.length : 0;
  nodeG.select(".rootarc").attr("stroke-dashoffset", 2*Math.PI*44*(1-frac));
  nodeG.select("#rootPct").text(Math.round(frac*100) + "%");

  sim.nodes(nodes);
  sim.force("link").links(links);
}

function ticked(){
  linkG.selectAll("line")
    .attr("x1", d => d.source.x).attr("y1", d => d.source.y)
    .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
  nodeG.selectAll("g.node").attr("transform", d => `translate(${d.x},${d.y})`);
}

function addNode(id, parentId, status = "suggested"){
  if (byId(id)) return null;
  const p = byId(parentId);
  const a = Math.random() * Math.PI * 2;
  const n = {id, ...IDEAS[id], status, parent: parentId, depth: p.depth + 1,
             x: p.x + Math.cos(a) * 20, y: p.y + Math.sin(a) * 20};
  nodes.push(n);
  links.push({source: parentId, target: id});
  render();
  sim.alpha(.7).restart();
  return n;
}

async function sprout(parentId, ids, gen){
  let added = 0;
  for (const id of ids){
    if (gen !== generation) return added;
    if (addNode(id, parentId)) { added++; await wait(170); }
  }
  return added;
}

/* ---------- panel ---------- */
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");

function select(id){ selectedId = id; panelMode = "view"; render(); renderPanel(); }

function promptFor(n){
  return `In the chronos-scheduler repo, implement: ${n.title}.\n\n${n.desc}\n\nContext: ${n.why}\n\nOnly modify: ${n.files.join(", ")}. Keep the change small and match the existing code style.`;
}

function genericDiff(n){
  const fn = n.title.replace(/[^a-zA-Z0-9 ]/g,"").split(" ").map((w,i)=> i? w[0].toUpperCase()+w.slice(1).toLowerCase() : w.toLowerCase()).join("");
  return n.files.slice(0,2).map(f => ({file:f, lines:[
    "@@ -1,3 +1,9 @@", `+// ${n.title}`, `+export function ${fn}(state) {`,
    `+  // ${n.desc}`, "+  ...", "+  return state;", "+}", "   // (preview shortened in prototype)"]}));
}

function diffHTML(n){
  return (n.diff || genericDiff(n)).map(f => `
    <div class="diff"><div class="fname">${esc(f.file)}</div><div class="code"><pre>${
      f.lines.map(l => {
        const cls = l.startsWith("@@") ? "hunk" : l[0] === "+" ? "add" : l[0] === "-" ? "del" : "";
        return `<span class="${cls}">${esc(l)}</span>`;
      }).join("")}</pre></div></div>`).join("");
}

function renderPanel(){
  const el = document.getElementById("detail");
  const n = byId(selectedId) || byId("root");
  const dis = busy ? "disabled" : "";

  if (n.id === "root"){
    const ideas = nodes.filter(x => x.id !== "root");
    const pr = ideas.filter(x => x.status === "pr").length, done = ideas.filter(x => x.status === "done").length;
    el.innerHTML = `
      <p class="eyebrow">Codebase</p>
      <h2>chronos-scheduler</h2>
      <p>React + Express scheduling app. ProjectGraph read 14 source files: a day-view calendar, an events API, and a local store. Every bubble is an idea grounded in those files.</p>
      <div class="stats">
        <div class="stat"><b>${ideas.length - pr - done}</b><span>Ideas</span></div>
        <div class="stat"><b>${pr}</b><span>PRs open</span></div>
        <div class="stat"><b>${done}</b><span>Shipped</span></div>
      </div>
      <p style="color:var(--muted);margin:0">Click any bubble to see the idea, expand it, or build it. Press <b>Simulate a push</b> to watch the map react to new commits.</p>`;
    return;
  }

  const chips = `<div class="chips">
      <span class="chip type ${n.type}">${TYPE_LABEL[n.type]}</span>
      <span class="chip">${EFFORT_LABEL[n.effort]} effort</span>
      ${n.status === "pr" ? `<span class="chip st-pr">PR #${n.pr} open</span>` : ""}
      ${n.status === "done" ? `<span class="chip st-done">Shipped</span>` : ""}
    </div>`;
  const head = `<p class="eyebrow">Idea</p>${chips}<h2>${esc(n.title)}</h2><p>${esc(n.desc)}</p>`;

  if (panelMode === "generating"){
    el.innerHTML = head + `<p style="color:var(--muted)">Gemini is writing the change against ${n.files.map(f=>`<code>${esc(f)}</code>`).join(", ")}…</p>`;
    return;
  }
  if (panelMode === "diff"){
    el.innerHTML = head + `<p class="eyebrow">Proposed change</p>${diffHTML(n)}
      <div class="actions">
        <button class="btn primary" data-act="openpr" type="button" ${dis}>Open pull request</button>
        <button class="btn" data-act="cancel" type="button" ${dis}>Cancel</button>
      </div>`;
    return;
  }
  if (panelMode === "opening"){
    el.innerHTML = head + `<ul class="steps" id="steps">
      <li>Create branch <code>idea/${slug(n.title)}</code></li>
      <li>Commit ${ (n.diff||genericDiff(n)).length } file(s)</li>
      <li>Open pull request #${prCounter + 1}</li></ul>`;
    return;
  }

  const kidsLeft = (n.kids || []).filter(k => !byId(k)).length;
  let actions = "";
  if (n.status === "suggested"){
    actions = `
      <button class="btn primary" data-act="build" type="button" ${dis}>Build it</button>
      <button class="btn" data-act="expand" type="button" ${dis || (kidsLeft ? "" : "disabled")}>${kidsLeft ? `Expand (${kidsLeft} ideas)` : "Expanded"}</button>
      <button class="btn" data-act="copy" type="button">Copy prompt</button>`;
  } else if (n.status === "pr"){
    actions = `
      <button class="btn primary" data-act="merge" type="button" ${dis}>Merge PR #${n.pr}</button>
      <button class="btn" data-act="expand" type="button" ${dis || (kidsLeft ? "" : "disabled")}>${kidsLeft ? `Expand (${kidsLeft} ideas)` : "Expanded"}</button>`;
  } else {
    actions = `<button class="btn" data-act="expand" type="button" ${dis || (kidsLeft ? "" : "disabled")}>${kidsLeft ? `Expand (${kidsLeft} ideas)` : "Expanded"}</button>`;
  }

  el.innerHTML = head + `
    <p class="eyebrow">Why this fits your code</p>
    <p class="why">${esc(n.why)}</p>
    <p class="eyebrow">Files</p>
    <ul class="files">${n.files.map(f => `<li>${esc(f)}</li>`).join("")}</ul>
    ${n.status === "pr" ? `<p style="color:var(--muted)">Branch <code>idea/${slug(n.title)}</code>. Merging lands it on main, and the next sync marks it shipped.</p>` : ""}
    ${n.status === "done" ? `<p style="color:var(--done)">Shipped in commit <code>${esc(n.commit)}</code>.</p>` : ""}
    <div class="actions">${actions}</div>
    ${n.status === "suggested" ? `<details><summary>Prompt for Claude Code or Cursor</summary><pre class="prompt" id="promptText">${esc(promptFor(n))}</pre></details>` : ""}`;
}

document.getElementById("detail").addEventListener("click", async e => {
  const b = e.target.closest("button[data-act]"); if (!b) return;
  const n = byId(selectedId); const gen = generation;
  switch (b.dataset.act){
    case "expand": {
      setBusy(true, "Gemini expanding idea…");
      await wait(700);
      const added = await sprout(n.id, n.kids || [], gen);
      if (gen !== generation) return;
      log("sync", `Expanded <b>${esc(n.title)}</b> into ${added} follow-up ideas`);
      setBusy(false); renderPanel(); break;
    }
    case "copy": {
      const text = promptFor(n);
      try { await navigator.clipboard.writeText(text); toast("Prompt copied"); }
      catch { const d = b.closest("#detail").querySelector("details"); d.open = true;
              const range = document.createRange(); range.selectNodeContents(document.getElementById("promptText"));
              const s = getSelection(); s.removeAllRanges(); s.addRange(range); toast("Prompt selected. Press Ctrl+C to copy."); }
      break;
    }
    case "build": {
      setBusy(true, "Gemini writing change…"); panelMode = "generating"; renderPanel();
      await wait(1300); if (gen !== generation) return;
      panelMode = "diff"; setBusy(false); renderPanel(); break;
    }
    case "cancel": panelMode = "view"; renderPanel(); break;
    case "openpr": {
      setBusy(true, "Opening pull request…"); panelMode = "opening"; renderPanel();
      const steps = [...document.querySelectorAll("#steps li")];
      for (const s of steps){ await wait(550); if (gen !== generation) return; s.classList.add("ok"); }
      prCounter++; n.status = "pr"; n.pr = prCounter;
      log("pr", `<b>PR #${n.pr}</b> opened: ${esc(n.title)}`);
      await wait(350); panelMode = "view"; setBusy(false); render(); renderPanel(); break;
    }
    case "merge": {
      const sha = Math.random().toString(16).slice(2,9);
      await syncCommit({sha, msg:`Merge pull request #${n.pr}`, author:"you", marks:n.id, plus:12+Math.floor(Math.random()*30), minus:Math.floor(Math.random()*6)});
      break;
    }
  }
});

/* ---------- sync loop: a commit lands, Gemini reads the diff, the map reacts ---------- */
async function syncCommit(c){
  const gen = generation;
  setBusy(true, `Reading ${c.sha}…`);
  log("commit", `New commit <code>${c.sha}</code> "${esc(c.msg)}" by ${esc(c.author)}`);
  await wait(900); if (gen !== generation) return;
  log("sync", `Gemini read diff (+${c.plus} −${c.minus})`);
  await wait(700); if (gen !== generation) return;

  let src;
  if (c.marks){
    src = byId(c.marks); src.status = "done"; src.commit = c.sha;
    log("ship", `<b>Shipped</b> ${esc(src.title)}`);
  } else if (c.adds){
    src = addNode(c.adds, "root", "done"); src.commit = c.sha;
    log("ship", `<b>Detected new code:</b> ${esc(src.title)}. You wrote this one yourself.`);
  }
  render(); if (selectedId === src.id) renderPanel();
  await wait(600); if (gen !== generation) return;
  const added = await sprout(src.id, src.kids || [], gen);
  if (gen !== generation) return;
  if (added) log("sync", `Sprouted ${added} ideas from <b>${esc(src.title)}</b>`);
  setBusy(false, `Watching main · synced ${c.sha}`);
  select(src.id);
}

document.getElementById("pushBtn").addEventListener("click", () => {
  while (pushIndex < SCRIPTED_PUSHES.length){
    const c = SCRIPTED_PUSHES[pushIndex++];
    if (c.marks && byId(c.marks)?.status === "done") continue;
    syncCommit(c); return;
  }
  toast("No more scripted commits. Merge a PR to keep going.");
  document.getElementById("pushBtn").disabled = true;
});
document.getElementById("restartBtn").addEventListener("click", init);

/* ---------- misc ---------- */
function setBusy(b, text){
  busy = b;
  document.getElementById("watch").classList.toggle("busy", b);
  if (text) document.getElementById("watchText").textContent = text;
  else if (!b) document.getElementById("watchText").textContent = "Watching main";
  document.getElementById("pushBtn").disabled = b || pushIndex >= SCRIPTED_PUSHES.length;
  document.getElementById("restartBtn").disabled = false;
  renderPanel();
}
function log(kind, html){
  const t = new Date().toLocaleTimeString([], {hour:"2-digit", minute:"2-digit", hour12:false});
  const li = document.createElement("li"); li.className = "k-" + kind;
  li.innerHTML = `<time>${t}</time><div>${html}</div>`;
  document.getElementById("feed").prepend(li);
}
let toastTimer;
function toast(msg){
  const el = document.getElementById("toast"); el.textContent = msg; el.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), 2200);
}

async function init(){
  generation++; const gen = generation;
  nodes = [{id:"root", title:"chronos-scheduler", depth:0, x:0, y:0, fx:0, fy:0}];
  links = []; selectedId = "root"; panelMode = "view"; prCounter = 13; pushIndex = 0;
  nodeG.selectAll("*").remove(); linkG.selectAll("*").remove();
  document.getElementById("feed").innerHTML = "";
  const w = sizeStage();
  svg.call(zoom.transform, d3.zoomIdentity.scale(w < 560 ? .62 : w < 900 ? .8 : 1));
  render(); setBusy(true, "Analyzing a41c9e2…");
  log("sync", `Read 14 files at <code>a41c9e2</code> on main`);
  await wait(350); if (gen !== generation) return;
  await sprout("root", FIRST_RING, gen);
  if (gen !== generation) return;
  log("sync", `Gemini suggested ${FIRST_RING.length} ideas grounded in your code`);
  setBusy(false, "Watching main · synced a41c9e2");
}
init();
</script>

</body></html>
